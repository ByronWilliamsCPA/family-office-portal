[project]
name = "family-office-portal"
version = "0.1.0"
description = "Secure family estate portal: consolidated view of entities, finances, documents, and portfolio."
authors = [
    {name = "Byron Williams", email = "byronawilliams@gmail.com"},
]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "aiosqlite>=0.20",
    "apscheduler>=3.10",
    "httpx>=0.27",
    "structlog>=24.0",
    "python-multipart>=0.0.9",
    "pyjwt[crypto]>=2.8",
    "pydantic-settings>=2.5",
]

[project.optional-dependencies]
dev = [
    "bandit>=1.7",
    "basedpyright>=1.18",
    "ruff>=0.4",
    "pip-audit>=2.7",
    "darglint>=1.8",
    "interrogate>=1.7",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pre-commit>=3.7",
    "commitizen>=3.27",
    "hypothesis>=6.110",
    "freezegun>=1.5",
]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",       # pycodestyle
    "F",            # Pyflakes
    "I",            # isort
    "UP",           # pyupgrade
    "B",            # flake8-bugbear
    "BLE",          # flake8-blind-except
    "EM",           # flake8-errmsg
    "SLF",          # flake8-self
    "INP",          # flake8-no-pep420
    "ISC",          # flake8-implicit-str-concat
    "PGH",          # pygrep-hooks
    "RSE",          # flake8-raise
    "TID",          # flake8-tidy-imports
    "YTT",          # flake8-2020
    "FA",           # flake8-future-annotations
    "T10",          # flake8-debugger
    "G",            # flake8-logging-format
    "ANN",          # flake8-annotations
    "TCH",          # flake8-type-checking
    "FBT",          # flake8-boolean-trap
    "TRY",          # tryceratops
    "ERA",          # eradicate (commented-out code)
    "FURB",         # refurb
    "LOG",          # flake8-logging
    "ASYNC",        # flake8-async
    "C4",           # flake8-comprehensions
    "PIE",          # flake8-pie
    "RET",          # flake8-return
    "SIM",          # flake8-simplify
    "PTH",          # flake8-use-pathlib
    "PL",           # pylint
    "RUF",          # Ruff-native rules
]
ignore = [
    "TRY003",   # long exception messages acceptable at this project scale
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
# Standalone CLI helpers in scripts/ are intentionally not a package.
"scripts/*.py" = ["INP001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# BasedPyright
# ---------------------------------------------------------------------------

[tool.basedpyright]
pythonVersion = "3.12"
pythonPlatform = "All"
typeCheckingMode = "strict"
strictListInference = true
strictDictionaryInference = true
strictSetInference = true

# ---------------------------------------------------------------------------
# Bandit
# ---------------------------------------------------------------------------

# Targets are passed via CLI args in pre-commit and CI invocations
# (`bandit -r app`); listing them here is redundant when bandit runs per-file.
# Tests are excluded via `exclude_dirs` in this section, so the B101 (assert-in-production) check stays on
# for `app/` -- assertions are stripped under `python -O` and must not be used
# as security checks. Re-add B101 to `skips` only if a documented exception
# applies.
[tool.bandit]
exclude_dirs = ["tests", ".venv", ".worktrees"]
skips = []

# ---------------------------------------------------------------------------
# interrogate
# ---------------------------------------------------------------------------

[tool.interrogate]
fail-under = 80
ignore-init-method = true
# Note: ignore-init-module intentionally kept false at Phase 0 because
# `app/__init__.py` is the only Python file in `app/` and it carries a
# real docstring; ignoring it would leave interrogate with zero countable
# units and `--fail-under=80` would error with "no Python files found".
# Re-enable once `app/` has enough non-init modules to make the ignore
# meaningful again.
ignore-init-module = false
ignore-magic = true
ignore-private = true
ignore-semiprivate = true
ignore-property-decorators = true
exclude = ["tests", ".venv", ".worktrees"]

# ---------------------------------------------------------------------------
# darglint
# ---------------------------------------------------------------------------

[tool.darglint]
docstring_style = "google"
strictness = "short"

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
