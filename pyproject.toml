[project]
name = "family-office-portal"
version = "0.1.0"
description = "Secure family estate portal: consolidated view of entities, finances, documents, and portfolio."
authors = [
    {name = "Byron Williams", email = "byronawilliams@gmail.com"},
]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "aiosqlite>=0.20",
    "apscheduler>=3.10",
    "httpx>=0.27",
    "structlog>=24.0",
    "python-multipart>=0.0.9",
    "pyjwt[crypto]>=2.8",
    "pydantic-settings>=2.5",
]

[project.optional-dependencies]
dev = [
    "bandit>=1.7",
    "basedpyright>=1.18",
    "ruff>=0.4",
    "pip-audit>=2.7",
    "pydoclint>=0.8.4",
    "interrogate>=1.7",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pre-commit>=3.7",
    "commitizen>=3.27",
    "hypothesis>=6.110",
    "freezegun>=1.5",
]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",       # pycodestyle
    "F",            # Pyflakes
    "I",            # isort
    "UP",           # pyupgrade
    "B",            # flake8-bugbear
    "BLE",          # flake8-blind-except
    "EM",           # flake8-errmsg
    "SLF",          # flake8-self
    "INP",          # flake8-no-pep420
    "ISC",          # flake8-implicit-str-concat
    "PGH",          # pygrep-hooks
    "RSE",          # flake8-raise
    "TID",          # flake8-tidy-imports
    "YTT",          # flake8-2020
    "FA",           # flake8-future-annotations
    "T10",          # flake8-debugger
    "G",            # flake8-logging-format
    "ANN",          # flake8-annotations
    "TCH",          # flake8-type-checking
    "FBT",          # flake8-boolean-trap
    "TRY",          # tryceratops
    "ERA",          # eradicate (commented-out code)
    "FURB",         # refurb
    "LOG",          # flake8-logging
    "ASYNC",        # flake8-async
    "C4",           # flake8-comprehensions
    "PIE",          # flake8-pie
    "RET",          # flake8-return
    "SIM",          # flake8-simplify
    "PTH",          # flake8-use-pathlib
    "PL",           # pylint
    "RUF",          # Ruff-native rules
]
ignore = [
    "TRY003",   # long exception messages acceptable at this project scale
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
# Build/maintenance scripts: standalone CLI helpers not in the app package;
# allow CLI prints, Any-typed JSON traversal, late imports (sys.path
# adjustment must precede ``app`` import), and the higher branch/return
# counts inherent to recursive schema walking.
"scripts/*" = [
    "INP001",    # not a package member
    "T201",      # print() is the script's user-facing output
    "PLC0415",   # late imports needed for sys.path manipulation
    "PLR0911",   # JSON walker naturally has many return branches
    "PLR0912",   # JSON walker naturally has many branches
    "PLR2004",   # depth caps and small magic numbers are clearer inline
    "ANN401",    # JSON values are by definition Any
    "FBT001",    # script-internal helpers, not a public API
]
"tests/*" = [
    "PLR2004",   # HTTP status codes are clearer as literals in assertions
    "S101",      # assert is the standard pytest assertion mechanism
    "UP017",     # tests run on Python 3.10; datetime.UTC requires 3.11+
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# BasedPyright
# ---------------------------------------------------------------------------

[tool.basedpyright]
pythonVersion = "3.12"
pythonPlatform = "All"
typeCheckingMode = "strict"
strictListInference = true
strictDictionaryInference = true
strictSetInference = true
# Restrict strict type checking to the runtime ``app`` package.
#   - ``scripts`` walks arbitrary JSON, where unknown-typed dict traversal
#     is unavoidable under strict mode.
#   - ``tests`` use pytest fixtures and httpx async patterns that pull in
#     dynamically-typed objects; strict mode adds noise without surfacing
#     real defects. Revisit if test helpers grow non-trivial logic.
# ``include`` already scopes the run, but listing ``exclude`` explicitly
# documents intent and guards against future config that broadens
# ``include`` without revisiting these scopes.
include = ["app"]
exclude = ["scripts", "tests", ".venv", ".worktrees"]

# ---------------------------------------------------------------------------
# Bandit
# ---------------------------------------------------------------------------

# Targets are passed via CLI args in pre-commit and CI invocations
# (`bandit -r app`); listing them here is redundant when bandit runs per-file.
# Tests are excluded via `exclude_dirs` in this section, so the B101 (assert-in-production) check stays on
# for `app/` -- assertions are stripped under `python -O` and must not be used
# as security checks. Re-add B101 to `skips` only if a documented exception
# applies.
[tool.bandit]
exclude_dirs = ["tests", ".venv", ".worktrees"]
skips = []

# ---------------------------------------------------------------------------
# interrogate
# ---------------------------------------------------------------------------

[tool.interrogate]
fail-under = 80
ignore-init-method = true
# Note: ignore-init-module intentionally kept false at Phase 0 because
# `app/__init__.py` is the only Python file in `app/` and it carries a
# real docstring; ignoring it would leave interrogate with zero countable
# units and `--fail-under=80` would error with "no Python files found".
# Re-enable once `app/` has enough non-init modules to make the ignore
# meaningful again.
ignore-init-module = false
ignore-magic = true
ignore-private = true
ignore-semiprivate = true
ignore-property-decorators = true
exclude = ["tests", ".venv", ".worktrees"]

# ---------------------------------------------------------------------------
# pydoclint
# ---------------------------------------------------------------------------

[tool.pydoclint]
style = "google"
exclude = '\.git|tests/|scripts/|benchmarks/|tools/|noxfile\.py|\.claude/'
arg-type-hints-in-docstring = true
arg-type-hints-in-signature = true
skip-checking-raises = false
require-return-section-when-returning-nothing = false
require-return-section-when-returning-values = false
require-yield-section-when-yielding-values = false

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

# ---------------------------------------------------------------------------
# pip-audit
# ---------------------------------------------------------------------------
# Each entry paired with a dated entry in docs/known-vulnerabilities.md.

[tool.pip-audit]
ignore-vuln = [
    "PYSEC-2022-42969",   # py==1.11.0 ReDoS; transitive via interrogate; no fix available
]
