{% if query %}
  {% if documents %}
  <ul class="divide-y divide-stone-200 bg-white rounded-xl border border-stone-200">
    {% for doc in documents %}
    <li class="px-5 py-4 flex justify-between gap-4">
      <a class="text-blue-800 underline" href="{{ doc['proxy_url'] }}">{{ doc['name'] }}</a>
      <span class="text-slate-500">{{ doc['category'] }}</span>
    </li>
    {% endfor %}
  </ul>
  {% else %}
  <p class="text-slate-600">No documents match "{{ query }}".</p>
  {% endif %}
{% endif %}
