<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Family Office{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/output.css">
</head>
<body class="min-h-screen bg-stone-50 text-slate-900 text-lg">
  <header class="bg-white border-b border-stone-200">
    <div class="max-w-5xl mx-auto px-6 py-4 flex flex-wrap items-center justify-between gap-4">
      <a href="/" class="text-2xl font-semibold text-slate-900">Family Office Portal</a>
      {% if principal %}
      <span class="text-base text-slate-600">Signed in as {{ principal.name or principal.username }}</span>
      {% endif %}
    </div>
    <nav aria-label="Main" class="max-w-5xl mx-auto px-6">
      <ul class="flex flex-wrap gap-2 pb-3">
        {% for key, label, href in nav_items %}
        <li>
          <a href="{{ href }}"
             class="block px-4 py-2 rounded-lg {% if key == section %}bg-slate-800 text-white{% else %}text-slate-700 hover:bg-stone-100{% endif %}"
             {% if key == section %}aria-current="page"{% endif %}>{{ label }}</a>
        </li>
        {% endfor %}
      </ul>
    </nav>
  </header>
  <main class="max-w-5xl mx-auto px-6 py-8">
    {% block content %}{% endblock %}
  </main>
  <script src="/static/htmx.min.js"></script>
</body>
</html>
