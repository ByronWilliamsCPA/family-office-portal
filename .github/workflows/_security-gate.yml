# Local reusable: called from security-analysis.yml to produce the
# "Security Analysis / Security Gate Validation" check run required
# by the org branch-protection ruleset. Receives job results as inputs
# because reusable workflows cannot access the caller's needs context.
name: Security Gate (reusable)

on:
  workflow_call:
    inputs:
      dependency-security-result:
        description: Result of the dependency-security job
        type: string
        required: true
      security-scanning-result:
        description: Result of the security-scanning job
        type: string
        required: true
      osv-scanner-result:
        description: Result of the osv-scanner job
        type: string
        required: true
      owasp-dependency-check-result:
        description: Result of the owasp-dependency-check job
        type: string
        required: true

jobs:
  security-gate-validation:
    name: Security Gate Validation
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit outbound calls)
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40  # v2.19.0
        with:
          egress-policy: audit

      - name: Validate Security Results
        env:
          DEP_RESULT: ${{ inputs.dependency-security-result }}
          SCAN_RESULT: ${{ inputs.security-scanning-result }}
          OSV_RESULT: ${{ inputs.osv-scanner-result }}
          OWASP_RESULT: ${{ inputs.owasp-dependency-check-result }}
        run: |
          is_acceptable() { [[ "$1" == "success" || "$1" == "skipped" ]]; }
          if is_acceptable "$DEP_RESULT" && \
             is_acceptable "$SCAN_RESULT" && \
             is_acceptable "$OSV_RESULT" && \
             is_acceptable "$OWASP_RESULT"; then
            echo "Security gate passed"
          else
            echo "Security gate FAILED"
            echo "dep-security: $DEP_RESULT"
            echo "scanning: $SCAN_RESULT"
            echo "osv: $OSV_RESULT"
            echo "owasp: $OWASP_RESULT"
            exit 1
          fi
