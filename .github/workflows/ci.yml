name: CI

on:
  merge_group:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - develop
      - 'feature/**'
  push:
    branches:
      - main
      - develop

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Org Reusable CI (Test, Lint, Type Check, Security)
    uses: ByronWilliamsCPA/.github/.github/workflows/python-ci.yml@961eb17d8e9b7fe0d8bfc5dbe9d23c824484fb11  # main 2026-05-07
    permissions:
      contents: read
    with:
      python-version: '3.12'
      source-directory: 'app'
      test-directory: 'tests'
      coverage-threshold: 0

  type-check-strict:
    # #CRITICAL ByronWilliamsCPA/.github python-ci.yml (reusable, called above
    # as the ci job) treats BasedPyright findings as a warning only
    # (via echo "::warning..." on failure), never a hard failure. CLAUDE.md's
    # Core development standards mandate "BasedPyright strict mode"; this job
    # re-runs the same check as a hard gate so the CI-001 migration to the
    # org reusable workflow does not silently weaken that standard.
    # #VERIFY if a future python-ci.yml revision adds its own hard-fail
    # input for type checking, drop this job and pass that input instead.
    name: Type Checking (strict gate)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      # deferral: 2026-11-22 -- egress-policy remains audit pending
      # confirmation of the full allowed-endpoints list for this job; flip to
      # block once the audit log has been reviewed (CI-031).
      - name: Harden the runner (Audit outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: '3.12'

      - name: Install UV
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --frozen --all-extras --no-build

      - name: Type checking with BasedPyright (hard fail)
        run: uv run --frozen --no-build basedpyright app

  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [ci, type-check-strict]
    permissions: {}
    if: always()
    steps:
      - name: Harden the runner (Audit outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          egress-policy: audit

      - name: CI Gate
        run: |
          if [[ "${{ needs.ci.result }}" == "success" && \
                "${{ needs.type-check-strict.result }}" == "success" ]]; then
            echo "CI Gate - Production Ready"
          else
            echo "CI Gate - Quality Standards Not Met"
            echo "ci: ${{ needs.ci.result }}"
            echo "type-check-strict: ${{ needs.type-check-strict.result }}"
            exit 1
          fi
