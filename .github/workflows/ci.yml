name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - develop
      - 'feature/**'
  push:
    branches:
      - main
      - develop

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI_ENVIRONMENT: true

jobs:
  setup-optimized:
    name: Setup with UV Caching
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      uv-hash: ${{ steps.cache-key.outputs.uv-hash }}
    steps:
      - name: Harden the runner (Audit outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Generate cache keys
        id: cache-key
        run: |
          echo "uv-hash=${{ hashFiles('**/uv.lock') }}" >> $GITHUB_OUTPUT

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install UV
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Cache UV dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            .venv
            ~/.cache/uv
          key: py-deps-${{ runner.os }}-${{ steps.cache-key.outputs.uv-hash }}
          restore-keys: |
            py-deps-${{ runner.os }}-

      - name: Install dependencies
        run: uv sync --frozen --all-extras --no-build

      - name: Dependency validation
        run: |
          uv run --frozen --no-build python -c "
          import sys
          required_deps = ['fastapi', 'structlog']
          for dep in required_deps:
              try:
                  mod = __import__(dep)
                  version = getattr(mod, '__version__', 'unknown')
                  print(f'  OK {dep} ({version})')
              except ImportError as e:
                  print(f'  FAIL {dep}: {e}')
                  sys.exit(1)
          print('All core dependencies validated')
          "

  test:
    name: Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: setup-optimized
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
      fail-fast: false

    steps:
      - name: Harden the runner (Audit outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install UV
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Restore dependency cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            .venv
            ~/.cache/uv
          key: py-deps-${{ runner.os }}-${{ needs.setup-optimized.outputs.uv-hash }}
          restore-keys: |
            py-deps-${{ runner.os }}-

      - name: Install dependencies
        run: uv sync --frozen --all-extras --no-build

      - name: Run test suite
        run: |
          uv run --frozen pytest -v \
            --cov=app \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --cov-report=html:htmlcov \
            --cov-fail-under=0 \
            --junitxml=junit.xml \
            -o junit_family=xunit2 \
            --tb=short \
            --maxfail=10 \
            tests/
        env:
          CI_ENVIRONMENT: true

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: test-results-${{ matrix.python-version }}
          path: |
            junit.xml
            coverage.xml
            htmlcov/

  quality-checks:
    name: Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 12
    needs: setup-optimized
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install UV
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Restore dependency cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            .venv
            ~/.cache/uv
          key: py-deps-${{ runner.os }}-${{ needs.setup-optimized.outputs.uv-hash }}
          restore-keys: |
            py-deps-${{ runner.os }}-

      - name: Install dependencies
        run: uv sync --frozen --all-extras --no-build

      - name: Type checking with BasedPyright
        run: uv run --frozen --no-build basedpyright app

      - name: Code formatting validation
        run: uv run --frozen --no-build ruff format --check

      - name: Linting with enhanced rules
        run: uv run --frozen --no-build ruff check . --config=pyproject.toml

  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    needs: [setup-optimized, test, quality-checks]
    permissions: {}
    if: always()
    steps:
      - name: Harden the runner (Audit outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      - name: CI Gate
        run: |
          if [[ "${{ needs.setup-optimized.result }}" == "success" && \
                "${{ needs.test.result }}" == "success" && \
                "${{ needs.quality-checks.result }}" == "success" ]]; then
            echo "CI Gate - Production Ready"
          else
            echo "CI Gate - Quality Standards Not Met"
            echo "setup-optimized: ${{ needs.setup-optimized.result }}"
            echo "test: ${{ needs.test.result }}"
            echo "quality-checks: ${{ needs.quality-checks.result }}"
            exit 1
          fi
