#
# Newman (Postman CLI) contract tests against the Phase 0 stub API.
#
# Environment variables the FastAPI app needs to boot:
#
#   AUTHENTIK_JWT_SECRET       HS256 key for X-authentik-jwt; generated per run
#                              here, never read from a repository secret.
#   AUTHENTIK_ISSUER           Expected ``iss`` claim of X-authentik-jwt.
#   AUTHENTIK_AUDIENCE         Expected ``aud`` claim (provider client ID).
#   SQLITE_PATH                Filesystem path to the SQLite cache database.
#
# The BACKEND_<NAME>_URL and BACKEND_<NAME>_API_KEY pairs are optional and are
# left unset here, so every backend is "not connected" during the run.
#
# In this workflow the variables are seeded with harmless placeholder values
# so that no real credentials are hardcoded. AUTHENTIK_JWT_SECRET has no
# placeholder: a step generates a random value with openssl on every run, so
# no secret literal lives in this file, and it must never be set from a
# repository secret. The production client secret must never be stored as a
# repository Actions secret, because a holder of it can forge the forwarded
# identity token. The other variables can be overridden in the repository's
# Actions secrets to point Newman at a non-stub environment.
#
# Newman sends no identity token, so every protected route must answer 403
# (the collection's fail-closed contract, ADR-005) and only /health returns
# 200. The generated secret never verifies anything here: requests without a
# token are denied before any signature verification.
---
name: Postman API Tests

on:  # yamllint disable-line rule:truthy
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: postman-${{ github.ref }}
  cancel-in-progress: true

jobs:
  newman:
    name: Newman contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AUTHENTIK_ISSUER: ${{ secrets.AUTHENTIK_ISSUER || 'https://auth.example.invalid/application/o/family-office-portal/' }}
      AUTHENTIK_AUDIENCE: ${{ secrets.AUTHENTIK_AUDIENCE || 'placeholder-client-id' }}
      SQLITE_PATH: ${{ secrets.SQLITE_PATH || '/tmp/portal.db' }}
      # Optional (app/config.py): keep the refresh scheduler off during the
      # contract run.
      SCHEDULER_ENABLED: "false"

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25  # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install UV
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Python dependencies
        run: uv sync --frozen --all-extras

      - name: Set up Node.js (for Newman)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '20'

      - name: Install Newman
        run: npm install --global newman@6.2.1

      - name: Generate the auth test secret
        run: |
          secret="$(openssl rand -hex 32)"
          echo "::add-mask::${secret}"
          echo "AUTHENTIK_JWT_SECRET=${secret}" >> "$GITHUB_ENV"

      - name: Start FastAPI app in background
        run: |
          nohup uv run uvicorn app.main:app --host 127.0.0.1 --port 8000 \
            > uvicorn.log 2>&1 &
          echo $! > uvicorn.pid

      - name: Wait for /health to respond (30s timeout)
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/health > /dev/null; then
              echo "App is healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "App did not become healthy within 30s"
          echo "--- uvicorn.log ---"
          cat uvicorn.log || true
          exit 1

      - name: Run Newman
        run: |
          newman run docs/api/postman-collection.json \
            --env-var baseUrl=http://127.0.0.1:8000 \
            --reporters cli,junit \
            --reporter-junit-export newman-report.xml

      - name: Stop FastAPI app
        if: always()
        run: |
          if [ -f uvicorn.pid ]; then
            kill "$(cat uvicorn.pid)" 2>/dev/null || true
          fi

      - name: Upload Newman report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: newman-report
          path: newman-report.xml
          if-no-files-found: ignore
