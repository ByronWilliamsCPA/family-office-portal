#
# Newman (Postman CLI) contract tests against the Phase 0 stub API.
#
# Required GitHub Actions secrets for the FastAPI app to boot:
#
#   BACKEND_LLC_MANAGER_URL    Base URL of the llc-manager backend.
#   BACKEND_PP_SECURITY_URL    Base URL of the pp-security-master backend.
#   BACKEND_XERO_CRYPTO_URL    Base URL of the xero_crypto backend.
#   BACKEND_FAMILY_OFFICE_URL  Base URL of the family_office backend.
#   AUTHENTIK_JWT_SECRET       Client secret of the Authentik proxy provider
#                              (HS256 key for X-authentik-jwt).
#   AUTHENTIK_ISSUER           Expected ``iss`` claim of X-authentik-jwt.
#   AUTHENTIK_AUDIENCE         Expected ``aud`` claim (provider client ID).
#   SQLITE_PATH                Filesystem path to the SQLite cache database.
#
# In this workflow the variables are seeded with harmless placeholder values
# so that no real credentials are hardcoded. AUTHENTIK_JWT_SECRET has no
# placeholder: a step generates a random value at runtime, so no secret
# literal lives in this file. Override any of the above in the repository's
# Actions secrets to point Newman at a non-stub environment.
#
# Newman sends no identity token, so every protected route must answer 403
# (the collection's fail-closed contract, ADR-005) and only /health returns
# 200. The generated secret never verifies anything here: requests without a
# token are denied before any signature verification.
---
name: Postman API Tests

on:  # yamllint disable-line rule:truthy
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: postman-${{ github.ref }}
  cancel-in-progress: true

jobs:
  newman:
    name: Newman contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BACKEND_LLC_MANAGER_URL: ${{ secrets.BACKEND_LLC_MANAGER_URL || 'http://localhost:9001' }}
      BACKEND_PP_SECURITY_URL: ${{ secrets.BACKEND_PP_SECURITY_URL || 'http://localhost:9002' }}
      BACKEND_XERO_CRYPTO_URL: ${{ secrets.BACKEND_XERO_CRYPTO_URL || 'http://localhost:9003' }}
      BACKEND_FAMILY_OFFICE_URL: ${{ secrets.BACKEND_FAMILY_OFFICE_URL || 'http://localhost:9004' }}
      AUTHENTIK_ISSUER: ${{ secrets.AUTHENTIK_ISSUER || 'https://auth.example.invalid/application/o/family-office-portal/' }}
      AUTHENTIK_AUDIENCE: ${{ secrets.AUTHENTIK_AUDIENCE || 'placeholder-client-id' }}
      SQLITE_PATH: ${{ secrets.SQLITE_PATH || '/tmp/portal.db' }}

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install UV
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Python dependencies
        run: uv sync --frozen --all-extras

      - name: Set up Node.js (for Newman)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '20'

      - name: Install Newman
        run: npm install --global newman@6.2.1

      - name: Generate the auth test secret
        env:
          AUTHENTIK_JWT_SECRET_OVERRIDE: ${{ secrets.AUTHENTIK_JWT_SECRET }}
        run: |
          if [ -n "${AUTHENTIK_JWT_SECRET_OVERRIDE}" ]; then
            echo "::add-mask::${AUTHENTIK_JWT_SECRET_OVERRIDE}"
            echo "AUTHENTIK_JWT_SECRET=${AUTHENTIK_JWT_SECRET_OVERRIDE}" >> "$GITHUB_ENV"
          else
            secret="$(openssl rand -hex 32)"
            echo "::add-mask::${secret}"
            echo "AUTHENTIK_JWT_SECRET=${secret}" >> "$GITHUB_ENV"
          fi

      - name: Start FastAPI app in background
        run: |
          nohup uv run uvicorn app.main:app --host 127.0.0.1 --port 8000 \
            > uvicorn.log 2>&1 &
          echo $! > uvicorn.pid

      - name: Wait for /health to respond (30s timeout)
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/health > /dev/null; then
              echo "App is healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "App did not become healthy within 30s"
          echo "--- uvicorn.log ---"
          cat uvicorn.log || true
          exit 1

      - name: Run Newman
        run: |
          newman run docs/api/postman-collection.json \
            --env-var baseUrl=http://127.0.0.1:8000 \
            --reporters cli,junit \
            --reporter-junit-export newman-report.xml

      - name: Stop FastAPI app
        if: always()
        run: |
          if [ -f uvicorn.pid ]; then
            kill "$(cat uvicorn.pid)" 2>/dev/null || true
          fi

      - name: Upload Newman report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: newman-report
          path: newman-report.xml
          if-no-files-found: ignore
