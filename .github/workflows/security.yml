#
# Lightweight Phase 0 security workflow: runs Bandit (static analysis) and
# pip-audit (dependency CVE scan) on every pull request and every push to main.
# The broader, change-aware security pipeline lives in security-analysis.yml.
name: Security

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Bandit + pip-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden the runner (Audit outbound calls)
        # `egress-policy: audit` matches the convention used by every other
        # workflow in this repo (ci.yml, security-analysis.yml, sonarcloud.yml,
        # etc.). Switching to `block` requires first capturing the runtime
        # endpoints that uv/pip-audit/setup-python actually reach from a clean
        # audit log; that work is tracked separately and is not in Phase 0
        # scope.
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'

      - name: Install UV
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dev dependencies
        run: uv sync --frozen --all-extras

      - name: Run Bandit
        run: uv run bandit -c pyproject.toml -r app

      - name: Run pip-audit
        # No accepted vulnerability is open, so there are no ignore flags.
        # pip-audit does not read an ignore list from pyproject.toml: an
        # accepted vulnerability needs a dated entry in
        # docs/known-vulnerabilities.md AND the same --ignore-vuln flag here
        # and in security-analysis.yml.
        run: uv run pip-audit
