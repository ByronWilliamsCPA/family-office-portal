#
# Lightweight Phase 0 security workflow: runs Bandit (static analysis) and
# pip-audit (dependency CVE scan) on every pull request and every push to main.
# The broader, change-aware security pipeline lives in security-analysis.yml.
name: Security

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Bandit + pip-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden the runner (Audit outbound calls)
        # `egress-policy: audit` matches the convention used by every other
        # workflow in this repo (ci.yml, security-analysis.yml, sonarcloud.yml,
        # etc.). Switching to `block` requires first capturing the runtime
        # endpoints that uv/pip-audit/setup-python actually reach from a clean
        # audit log; that work is tracked separately and is not in Phase 0
        # scope.
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install UV
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dev dependencies
        run: uv sync --frozen --all-extras

      - name: Run Bandit
        run: uv run bandit -c pyproject.toml -r app

      - name: Run pip-audit
        # PYSEC-2022-42969: ReDoS in py.path.svnwc; py 1.x is unmaintained and
        # has no fix. We pull `py` only as a transitive of `interrogate`, do
        # not touch SVN, and document the deferral in
        # docs/known-vulnerabilities.md.
        run: uv run pip-audit --ignore-vuln PYSEC-2022-42969
