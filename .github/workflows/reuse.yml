name: REUSE Compliance

on:
  merge_group:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: reuse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reuse:
    name: Check REUSE Compliance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # deferral: 2026-11-22 -- egress-policy remains audit pending
      # confirmation of the full allowed-endpoints list for this job; flip to
      # block once the audit log has been reviewed (CI-031).
      - name: Harden the runner (Audit outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25  # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install reuse
        run: pip install reuse

      - name: REUSE lint
        run: reuse lint

      - name: Generate SPDX bill of materials
        run: reuse spdx -o reuse-spdx-sbom.spdx

      - name: Upload SPDX
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: reuse-spdx-sbom
          path: reuse-spdx-sbom.spdx
          if-no-files-found: warn
