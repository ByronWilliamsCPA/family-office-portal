name: REUSE Compliance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: reuse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reuse:
    name: Check REUSE Compliance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # deferral: 2026-11-22 -- egress-policy remains audit pending
      # confirmation of the full allowed-endpoints list for this job; flip to
      # block once the audit log has been reviewed (CI-031).
      - name: Harden the runner (Audit outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false

      - name: Install reuse
        run: pip install reuse

      - name: REUSE lint
        run: reuse lint

      - name: Generate SPDX bill of materials
        run: reuse spdx -o reuse-spdx-sbom.spdx

      - name: Upload SPDX
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: reuse-spdx-sbom
          path: reuse-spdx-sbom.spdx
          if-no-files-found: warn
