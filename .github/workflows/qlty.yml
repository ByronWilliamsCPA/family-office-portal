# Qlty code quality gate for Family Office Portal.
#
# The qlty.sh GitHub App's own StatusContext always reports SUCCESS regardless
# of blocking-issue count and cannot enforce anything. This workflow's
# qlty-gate job is a real GitHub Actions CheckRun that fails the build on
# medium+ severity issues in the PR diff (CI-078).
#
# Coverage upload to qlty.sh is intentionally NOT wired here: it requires a
# QLTY_COVERAGE_TOKEN secret that is not yet configured for this Phase 0
# repo. Add a `qlty` job calling python-qlty-coverage.yml once that secret
# exists (see llc-manager/.github/workflows/qlty.yml for the pattern).
name: Qlty

on:
  pull_request:
    branches: [main]
  schedule:
    # Weekly full-codebase health scan: Monday 07:00 UTC
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: qlty-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # PR gate: diff mode, blocks merges that introduce medium+ severity issues.
  # Check name: "qlty-gate / Qlty Gate" -- advisory only, not a required
  # status context on this repo's branch protection today.
  # #ASSUME no org ruleset currently requires this context.
  # #VERIFY before making it required: add a `merge_group:` trigger to this
  # workflow (required contexts must report on merge-queue runs too), and
  # emit the bare required-context name from a direct job (one with `steps:`,
  # not `uses:`), since a reusable-workflow caller job can only ever report
  # "<caller job name> / <inner job name>", never the bare name a ruleset
  # would require.
  qlty-gate:
    if: github.event_name == 'pull_request'
    uses: ByronWilliamsCPA/.github/.github/workflows/python-qlty-gate.yml@b7c661ec3bfeb04370ce3a9c748bd8c4e93bfe89  # v10.1.9
    permissions:
      contents: read
    with:
      fail-level: medium
      upstream: origin/${{ github.base_ref }}

  # Weekly health scan: full codebase, informational only.
  #
  # This job is inline on purpose. The shared python-qlty-gate.yml workflow
  # always passes --fail-level to qlty, and when no-fail is true it also passes
  # --no-fail; the qlty CLI rejects that pair ("the argument '--fail-level
  # <FAIL_LEVEL>' cannot be used with '--no-fail'"), which failed the scheduled
  # run of 2026-10-12. Use this inline job until the shared workflow stops
  # sending both flags, then go back to calling it.
  # Remove --no-fail once existing qlty debt is resolved.
  qlty-health:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: Qlty Health Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          # #ASSUME: qlty check reads source files only and needs no Git credentials.
          # #VERIFY: re-enable credentials only if a later step pushes or calls the API.
          persist-credentials: false

      - name: Install Qlty CLI
        uses: qltysh/qlty-action/install@08a0a862c159eae9b9003081da6663d96efef637  # v2.3.0

      - name: Run qlty check (informational)
        run: qlty check --all --no-fail
