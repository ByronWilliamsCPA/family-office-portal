name: Codecov

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

permissions: read-all

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  upload-coverage:
    name: Upload Coverage to Codecov
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      actions: read

    steps:
      - name: Harden the runner (Audit outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      - name: Download coverage artifacts (Python 3.12)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: test-results-3.12
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          path: coverage-3.12
        continue-on-error: true

      - name: Upload coverage to Codecov (Python 3.12)
        if: hashFiles('coverage-3.12/coverage.xml') != ''
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: ${{ github.repository }}
          file: coverage-3.12/coverage.xml
          fail_ci_if_error: false
          flags: python-3.12
          name: family-office-portal Coverage (Python 3.12)
          commit_parent: ${{ github.event.workflow_run.head_sha }}

      - name: Coverage upload summary
        if: always()
        env:
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          echo "## Codecov Upload Summary" >> $GITHUB_STEP_SUMMARY
          for version in 3.12; do
            if [ -f "coverage-${version}/coverage.xml" ]; then
              echo "- Python ${version}: Coverage uploaded" >> $GITHUB_STEP_SUMMARY
            else
              echo "- Python ${version}: No coverage report found" >> $GITHUB_STEP_SUMMARY
            fi
          done
