name: Codecov

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

permissions: read-all

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  upload-coverage:
    name: Upload Coverage to Codecov
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      actions: read

    steps:
      - name: Harden the runner (Audit outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25  # v2.22.1
        with:
          egress-policy: audit

      # CI-001 migrated ci.yml's `test` job to the org reusable python-ci.yml
      # workflow, which uploads a single unversioned "coverage-reports"
      # artifact (coverage.xml at its root) instead of the old per-Python-version
      # "test-results-3.12" artifact. Updated to match.
      - name: Download coverage artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: coverage-reports
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          path: coverage-reports
        continue-on-error: true

      - name: Upload coverage to Codecov
        if: hashFiles('coverage-reports/coverage.xml') != ''
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: ${{ github.repository }}
          file: coverage-reports/coverage.xml
          fail_ci_if_error: false
          flags: python-3.12
          name: family-office-portal Coverage (Python 3.12)
          commit_parent: ${{ github.event.workflow_run.head_sha }}

      - name: Coverage upload summary
        if: always()
        env:
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          echo "## Codecov Upload Summary" >> $GITHUB_STEP_SUMMARY
          if [ -f "coverage-reports/coverage.xml" ]; then
            echo "- Coverage uploaded" >> $GITHUB_STEP_SUMMARY
          else
            echo "- No coverage report found" >> $GITHUB_STEP_SUMMARY
          fi
