name: Codecov

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

permissions: read-all

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  upload-coverage:
    name: Upload Coverage to Codecov
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      actions: read

    steps:
      - name: Harden the runner (Audit outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      # CI-001 migrated ci.yml's `test` job to the org reusable python-ci.yml
      # workflow, which uploads a single unversioned "coverage-reports"
      # artifact (coverage.xml at its root) instead of the old per-Python-version
      # "test-results-3.12" artifact. Updated to match.
      - name: Download coverage artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: coverage-reports
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          path: coverage-reports
        continue-on-error: true

      - name: Upload coverage to Codecov
        if: hashFiles('coverage-reports/coverage.xml') != ''
        uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354  # v6.0.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: ${{ github.repository }}
          file: coverage-reports/coverage.xml
          fail_ci_if_error: false
          flags: python-3.12
          name: family-office-portal Coverage (Python 3.12)
          commit_parent: ${{ github.event.workflow_run.head_sha }}

      - name: Coverage upload summary
        if: always()
        env:
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          echo "## Codecov Upload Summary" >> $GITHUB_STEP_SUMMARY
          if [ -f "coverage-reports/coverage.xml" ]; then
            echo "- Coverage uploaded" >> $GITHUB_STEP_SUMMARY
          else
            echo "- No coverage report found" >> $GITHUB_STEP_SUMMARY
          fi
