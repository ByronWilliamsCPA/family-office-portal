# .github/workflows/python-compatibility.yml
name: Python Compatibility

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  compatibility:
    name: Compatibility Matrix
    # Workflow-level permissions provide an audit surface; job-level block below is required by GitHub for reusable workflow inheritance.
    uses: ByronWilliamsCPA/.github/.github/workflows/python-compatibility.yml@e753ebbf3c2fac40177495137391f2a45adab93a  # main 2026-05-07
    with:
      python-versions: '["3.12", "3.13"]'
      operating-systems: '["ubuntu-latest"]'
      include-windows: false
      include-macos: false
      source-directory: 'app'
      test-command: 'pytest -v'
      coverage-report: true
      fail-fast: false
    permissions:
      contents: read
