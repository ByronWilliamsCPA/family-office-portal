# .github/workflows/python-compatibility.yml
name: Python Compatibility

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  compatibility:
    name: Compatibility Matrix
    # The workflow-level permissions block above applies to this caller workflow only.
    # Reusable workflows run under the permissions defined in their own workflow file, not those of the caller.
    uses: ByronWilliamsCPA/.github/.github/workflows/python-compatibility.yml@961eb17d8e9b7fe0d8bfc5dbe9d23c824484fb11  # main 2026-05-07
    with:
      python-versions: '["3.10", "3.11", "3.12", "3.13", "3.14"]'
      operating-systems: '["ubuntu-latest"]'
      include-windows: false
      include-macos: false
      source-directory: 'app'
      test-command: 'uv run --frozen pytest -v'
      coverage-report: true
      fail-fast: false
    permissions:
      contents: read
