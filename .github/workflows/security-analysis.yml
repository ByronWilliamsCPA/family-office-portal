name: Security Analysis

on:
  pull_request:
    branches:
      - main
      - develop
      - 'feature/**'
  schedule:
    - cron: '30 2 * * 1'  # Weekly Monday 2:30 AM UTC
  workflow_dispatch:

permissions: read-all

concurrency:
  group: security-analysis-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect Security-Relevant Changes
    runs-on: ubuntu-latest
    outputs:
      security_files: ${{ steps.filter.outputs.security }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0

      - name: Check for security-relevant file changes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        with:
          filters: |
            security:
              - '**/*.py'
              - '.github/workflows/security-analysis.yml'
              - 'pyproject.toml'
              - 'uv.lock'

  dependency-security:
    name: Dependency Security Review
    runs-on: ubuntu-latest
    needs: detect-changes
    if: |
      github.event_name == 'pull_request' &&
      needs.detect-changes.outputs.security_files == 'true'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Harden the runner (Audit outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          fail-on-severity: moderate
          license-check: true
          comment-summary-in-pr: always
          deny-licenses: GPL-2.0, GPL-3.0

  security-scanning:
    name: Multi-Tool Security Scan
    runs-on: ubuntu-latest
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.security_files == 'true' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    timeout-minutes: 15
    steps:
      - name: Harden the runner (Audit outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: '3.12'

      - name: Install UV
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Dependencies
        run: uv sync --frozen --all-extras

      - name: Bandit Security Analysis
        run: |
          uv run bandit -r app \
            -f json -o bandit-report.json \
            -c pyproject.toml
          uv run bandit -r app -c pyproject.toml

      - name: pip-audit Vulnerability Scan
        # PYSEC-2022-42969 (py@1.11.0, transitive via interrogate, dev-only):
        # mitigation accepted and tracked in docs/known-vulnerabilities.md.
        # Quarterly reassessment is enforced by project policy; the OpenSSF
        # release gate still blocks releases for any entry older than 60 days.
        run: |
          uv run pip-audit \
            --format json \
            --output pip-audit-report.json \
            --ignore-vuln PYSEC-2022-42969
          uv run pip-audit --ignore-vuln PYSEC-2022-42969

      - name: Upload Security Reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: security-scan-reports
          path: |
            bandit-report.json
            pip-audit-report.json

  osv-scanner:
    name: OSV Vulnerability Scanner
    runs-on: ubuntu-latest
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.security_files == 'true' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    steps:
      - name: Harden the runner (Audit outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0

      - name: Run OSV Scanner
        uses: google/osv-scanner-action/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc  # v2.6.0
        continue-on-error: true
        with:
          scan-args: |-
            --lockfile=uv.lock
            --format=json
            --output-file=osv-results.json

      - name: Check OSV Results for HIGH/CRITICAL
        if: always()
        run: |
          if [ ! -f osv-results.json ] || [ ! -s osv-results.json ]; then
            echo "ERROR: OSV results file missing or empty"
            exit 1
          fi
          python3 << 'EOF'
          import json, sys

          def extract_severity(vuln):
              for field in ['severity', ('database_specific', 'severity')]:
                  if isinstance(field, tuple):
                      val = vuln.get(field[0], {}).get(field[1])
                  else:
                      val = vuln.get(field)
                  if val:
                      s = str(val).upper()
                      return 'MEDIUM' if s == 'MODERATE' else s
              return 'UNKNOWN'

          with open('osv-results.json') as f:
              results = json.load(f)
          high_crit = []
          for group in results.get('results', []):
              for pkg in group.get('packages', []):
                  for vuln in pkg.get('vulnerabilities', []):
                      sev = extract_severity(vuln)
                      if sev in ('HIGH', 'CRITICAL'):
                          high_crit.append(f"{vuln.get('id', 'UNKNOWN')} ({sev})")
          if high_crit:
              print(f"FAIL: {len(high_crit)} HIGH/CRITICAL vulnerabilities found")
              for v in high_crit[:5]:
                  print(f"  - {v}")
              sys.exit(1)
          print("PASS: No HIGH/CRITICAL vulnerabilities found")
          EOF

      - name: Upload OSV Scanner Report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: osv-scanner-results
          path: osv-results.json
          if-no-files-found: warn

  owasp-dependency-check:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.security_files == 'true' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Harden the runner (Audit outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0

      - name: Run OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@75ba02d6183445fe0761d26e836bde58b1560600  # v1.1.0
        with:
          project: 'family-office-portal'
          path: '.'
          format: 'ALL'
          args: >
            --enableRetired
            --enableExperimental
            --failOnCVSS 7

      - name: Upload OWASP Report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: owasp-dependency-check-report
          path: reports/
          if-no-files-found: warn

      - name: Upload SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63  # v4.38.0
        with:
          sarif_file: reports/dependency-check-report.sarif

  security-analysis:
    name: Security Analysis
    needs:
      - detect-changes
      - dependency-security
      - security-scanning
      - osv-scanner
      - owasp-dependency-check
    if: always()
    uses: ./.github/workflows/_security-gate.yml
    with:
      dependency-security-result: ${{ needs.dependency-security.result }}
      security-scanning-result: ${{ needs.security-scanning.result }}
      osv-scanner-result: ${{ needs.osv-scanner.result }}
      owasp-dependency-check-result: ${{ needs.owasp-dependency-check.result }}
