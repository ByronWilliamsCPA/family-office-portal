name: Security Analysis

on:
  merge_group:
  pull_request:
    branches:
      - main
      - develop
      - 'feature/**'
  schedule:
    - cron: '30 2 * * 1'  # Weekly Monday 2:30 AM UTC
  workflow_dispatch:

permissions: read-all

concurrency:
  group: security-analysis-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect Security-Relevant Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      security_files: ${{ steps.filter.outputs.security }}
    steps:
      - name: Harden the runner (Audit outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Check for security-relevant file changes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        with:
          filters: |
            security:
              - '**/*.py'
              - '.github/workflows/security-analysis.yml'
              - 'pyproject.toml'
              - 'uv.lock'

  # actions/dependency-review-action was removed fleet-wide: GitHub now
  # bills Advanced Security (Code Security) for this action, so it no
  # longer runs on repos without that add-on. The "Dependency Security
  # Review" job that used to live here (gated on detect-changes) is gone;
  # dependency vulnerability coverage on this repo now comes from
  # pip-audit and OSV Scanner below.

  security-scanning:
    name: Multi-Tool Security Scan
    runs-on: ubuntu-latest
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.security_files == 'true' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    timeout-minutes: 15
    steps:
      - name: Harden the runner (Audit outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'

      - name: Install UV
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Dependencies
        run: uv sync --frozen --all-extras

      - name: Bandit Security Analysis
        run: |
          uv run bandit -r app \
            -f json -o bandit-report.json \
            -c pyproject.toml
          uv run bandit -r app -c pyproject.toml

      - name: pip-audit Vulnerability Scan
        # No accepted vulnerability is open, so there are no ignore flags.
        # pip-audit does not read an ignore list from pyproject.toml: an
        # accepted vulnerability needs a dated entry in
        # docs/known-vulnerabilities.md AND the same --ignore-vuln flag here
        # and in security.yml. The OpenSSF release gate blocks releases for
        # any entry older than 60 days.
        run: |
          uv run pip-audit \
            --format json \
            --output pip-audit-report.json
          uv run pip-audit

      - name: Upload Security Reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: security-scan-reports
          path: |
            bandit-report.json
            pip-audit-report.json

  osv-scanner:
    name: OSV Vulnerability Scanner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.security_files == 'true' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    steps:
      - name: Harden the runner (Audit outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # continue-on-error is intentional here and is a CI-007 exception (see
      # 7baf8b9). OSV-Scanner's own exit codes are 0 (no vulns), 1 (vulns
      # found, any severity), 127 (scanner error), 128 (no packages found);
      # it exits 1 on a single LOW finding just as readily as on a CRITICAL
      # one. Without continue-on-error, any LOW/MEDIUM finding fails this
      # required Security Gate step directly, bypassing the severity
      # threshold entirely. The actual gate is enforced by the next step,
      # "Check OSV Results for HIGH/CRITICAL", which parses osv-results.json
      # and fails only on HIGH/CRITICAL. That step also fails closed: it
      # runs with `if: always()` and exits 1 if osv-results.json is missing
      # or empty, so a scanner crash (exit 127/128) still fails the gate.
      # #VERIFY if osv-scanner-action changes its exit code contract, confirm
      # exit 1 still means "vulnerabilities found" before relying on this.
      - name: Run OSV Scanner
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36  # v2.7.0
        continue-on-error: true
        with:
          scan-args: |-
            --lockfile=uv.lock
            --format=json
            --output-file=osv-results.json

      - name: Check OSV Results for HIGH/CRITICAL
        if: always()
        run: |
          if [ ! -f osv-results.json ] || [ ! -s osv-results.json ]; then
            echo "ERROR: OSV results file missing or empty"
            exit 1
          fi
          python3 << 'EOF'
          import json, sys

          def extract_severity(vuln):
              for field in ['severity', ('database_specific', 'severity')]:
                  if isinstance(field, tuple):
                      val = vuln.get(field[0], {}).get(field[1])
                  else:
                      val = vuln.get(field)
                  if val:
                      s = str(val).upper()
                      return 'MEDIUM' if s == 'MODERATE' else s
              return 'UNKNOWN'

          with open('osv-results.json') as f:
              results = json.load(f)
          high_crit = []
          for group in results.get('results', []):
              for pkg in group.get('packages', []):
                  for vuln in pkg.get('vulnerabilities', []):
                      sev = extract_severity(vuln)
                      if sev in ('HIGH', 'CRITICAL'):
                          high_crit.append(f"{vuln.get('id', 'UNKNOWN')} ({sev})")
          if high_crit:
              print(f"FAIL: {len(high_crit)} HIGH/CRITICAL vulnerabilities found")
              for v in high_crit[:5]:
                  print(f"  - {v}")
              sys.exit(1)
          print("PASS: No HIGH/CRITICAL vulnerabilities found")
          EOF

      - name: Upload OSV Scanner Report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: osv-scanner-results
          path: osv-results.json
          if-no-files-found: warn

  owasp-dependency-check:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.security_files == 'true' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Run OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@75ba02d6183445fe0761d26e836bde58b1560600  # v1.1.0
        with:
          project: 'family-office-portal'
          path: '.'
          format: 'ALL'
          args: >
            --enableRetired
            --enableExperimental
            --failOnCVSS 7

      # github/codeql-action/upload-sarif removed: GitHub now bills
      # Advanced Security (Code Security), so SARIF ingestion into the
      # Security tab no longer functions on this repo. The report below
      # already covers the same reports/ directory (format: ALL includes
      # dependency-check-report.sarif), so findings are not lost.
      - name: Upload OWASP Report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: owasp-dependency-check-report
          path: reports/
          if-no-files-found: warn

  # Normal job (has steps:), not a workflow_call caller. A caller job
  # (uses: ./.github/workflows/_security-gate.yml) can only ever emit a
  # "<caller job name> / <inner job name>" context; it can never emit the
  # bare "Security Gate Validation" context that the org ruleset
  # ByronWilliamsCPA-default-branch-baseline requires. This job replaces the
  # former reusable-workflow-call indirection through _security-gate.yml
  # (now deleted) so the bare context actually reports on every PR.
  security-gate-validation:
    name: Security Gate Validation
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 5
    needs:
      - detect-changes
      - security-scanning
      - osv-scanner
      - owasp-dependency-check
    if: always()
    steps:
      - name: Harden the runner (Audit outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: audit

      - name: Validate Security Results
        env:
          DETECT_RESULT: ${{ needs.detect-changes.result }}
          SCAN_RESULT: ${{ needs.security-scanning.result }}
          OSV_RESULT: ${{ needs.osv-scanner.result }}
          OWASP_RESULT: ${{ needs.owasp-dependency-check.result }}
        run: |
          # #CRITICAL fail closed if change detection did not succeed. Every
          # scan job needs detect-changes, so a failed detect-changes skips
          # all three scans, and "skipped" alone would pass with no scan run.
          # #VERIFY a skipped scan is acceptable only after detect-changes
          # succeeded and reported no security-relevant files.
          is_acceptable() { [[ "$1" == "success" || "$1" == "skipped" ]]; }
          if [[ "$DETECT_RESULT" == "success" ]] && \
             is_acceptable "$SCAN_RESULT" && \
             is_acceptable "$OSV_RESULT" && \
             is_acceptable "$OWASP_RESULT"; then
            echo "Security gate passed"
          else
            echo "Security gate FAILED"
            echo "detect-changes: $DETECT_RESULT"
            echo "scanning: $SCAN_RESULT"
            echo "osv: $OSV_RESULT"
            echo "owasp: $OWASP_RESULT"
            exit 1
          fi
