name: PR Validation

on:
  pull_request:
    branches:
      - main
      - develop
    types:
      - opened
      - synchronize
      - reopened
      - edited

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  pr-validation:
    name: PR CI Checks
    uses: ByronWilliamsCPA/.github/.github/workflows/python-ci.yml@961eb17d8e9b7fe0d8bfc5dbe9d23c824484fb11  # main 2026-05-07
    with:
      python-version: '3.12'
      source-directory: 'app'
      test-directory: 'tests'
      coverage-threshold: 0
    permissions:
      contents: read
      pull-requests: write
      checks: write

  gate:
    name: Dependency & Standards Validation
    needs: [pr-validation]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Harden the runner (Audit outbound calls)
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5  # v2.19.3
        with:
          egress-policy: audit

      - name: Check CI gate
        env:
          PR_RESULT: ${{ needs.pr-validation.result }}
        run: |
          if [[ "$PR_RESULT" != "success" ]]; then
            echo "PR CI checks failed: $PR_RESULT"
            exit 1
          fi
          echo "All PR CI checks passed"
