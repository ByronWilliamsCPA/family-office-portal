name: PR Validation

on:
  pull_request:
    branches:
      - main
      - develop
    types:
      - opened
      - synchronize
      - reopened
      - edited

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  pr-validation:
    name: Dependency & Standards Validation
    uses: ByronWilliamsCPA/.github/.github/workflows/python-ci.yml@5237eba4100f903bbe86f0ad5962d4d398fafd76  # main 2026-05-07
    with:
      python-version: '3.12'
      source-directory: 'app'
      test-directory: 'tests'
      coverage-threshold: 0
    permissions:
      contents: read
      pull-requests: write
      checks: write
