name: PR Validation

on:
  pull_request:
    branches:
      - main
      - develop
    types:
      - opened
      - synchronize
      - reopened
      - edited

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  pr-validation:
    name: PR CI Checks
    uses: ByronWilliamsCPA/.github/.github/workflows/python-ci.yml@5237eba4100f903bbe86f0ad5962d4d398fafd76  # main 2026-05-07
    with:
      python-version: '3.12'
      source-directory: 'app'
      test-directory: 'tests'
      coverage-threshold: 0
    permissions:
      contents: read
      pull-requests: write
      checks: write

  gate:
    name: Dependency & Standards Validation
    needs: [pr-validation]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Harden the runner (Audit outbound calls)
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40  # v2.19.0
        with:
          egress-policy: audit

      - name: Check CI gate
        env:
          PR_RESULT: ${{ needs.pr-validation.result }}
        run: |
          if [[ "$PR_RESULT" != "success" ]]; then
            echo "PR CI checks failed: $PR_RESULT"
            exit 1
          fi
          echo "All PR CI checks passed"
