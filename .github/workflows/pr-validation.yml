name: PR Validation

on:
  pull_request:
    branches:
      - main
      - develop
    types:
      - opened
      - synchronize
      - reopened
      - edited

permissions:
  contents: read
  pull-requests: write
  checks: write

concurrency:
  group: pr-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-validation:
    name: PR CI Checks
    uses: ByronWilliamsCPA/.github/.github/workflows/python-ci.yml@961eb17d8e9b7fe0d8bfc5dbe9d23c824484fb11  # main 2026-05-07
    with:
      python-version: '3.12'
      source-directory: 'app'
      test-directory: 'tests'
      coverage-threshold: 0
    permissions:
      contents: read
      pull-requests: write
      checks: write

  gate:
    name: Dependency & Standards Validation
    needs: [pr-validation]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    if: always()
    steps:
      # deferral: 2026-11-22 -- egress-policy remains audit pending
      # confirmation of the full allowed-endpoints list for this job; flip to
      # block once the audit log has been reviewed (CI-031).
      - name: Harden the runner (Audit outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      - name: Check CI gate
        env:
          PR_RESULT: ${{ needs.pr-validation.result }}
        run: |
          if [[ "$PR_RESULT" != "success" ]]; then
            echo "PR CI checks failed: $PR_RESULT"
            exit 1
          fi
          echo "All PR CI checks passed"
