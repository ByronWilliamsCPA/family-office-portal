# Dependency Review - Analyzes dependency changes in PRs
# Checks for vulnerabilities and license compliance
#
# Features:
#   - Vulnerability detection in dependency changes
#   - License compliance checking
#   - Blocks PRs with high severity vulnerabilities
name: Dependency Review

# #CRITICAL do not add a merge_group: trigger here.
# actions/dependency-review-action reads github.event.pull_request.base
# and .head and hard-fails under merge_group, which carries no
# pull_request payload. This job shares the required context name
# "Dependency & Standards Validation" with the gate job in
# pr-validation.yml, so a failing run here would put a second, failing
# check under that required context inside the merge queue.
# pr-validation.yml already emits the context under merge_group.
# #VERIFY before enabling merge_group here, pass explicit base-ref and
# head-ref inputs (github.event.merge_group.base_sha / head_sha).
on:
  pull_request:
    branches: [main, master, develop]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Dependency & Standards Validation
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          # SPDX expressions for permissive open-source licenses we accept.
          # PSF-2.0 (Python Software Foundation) and HPND-Markus-Kuhn are both
          # OSI-approved permissive licenses; included to admit `distlib` and
          # `wcwidth` whose composite licenses are not covered by the base list.
          # MIT-0 (MIT No Attribution, OSI-approved) drops MIT's attribution
          # clause, so it is strictly more permissive than MIT; admits `cffi`
          # 2.x, whose PyPI license_expression is MIT-0.
          allow-licenses: MIT, MIT-0, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, MPL-2.0, LGPL-2.1, LGPL-3.0, Python-2.0, Unlicense, CC0-1.0, GPL-3.0-or-later, PSF-2.0, HPND-Markus-Kuhn
          # Dependencies whose detected license is missing or wrong. Each has a
          # documented permissive license on its repository or PyPI metadata;
          # vetted manually:
          #   - commitizen: MIT
          #   - hypothesis: MPL-2.0
          #   - pydantic-settings: MIT
          #   - python-discovery: MIT
          #   - virtualenv: MIT
          #   - typing-extensions: PSF-2.0 per its PyPI license_expression.
          #     GitHub's detector reads the CPython license history in its
          #     LICENSE file and reports a composite string that includes
          #     GPL-1.0-or-later. #ASSUME the PyPI metadata is authoritative.
          #     #VERIFY on each typing-extensions major that
          #     license_expression is still PSF-2.0.
          allow-dependencies-licenses: pkg:pypi/commitizen, pkg:pypi/hypothesis, pkg:pypi/pydantic-settings, pkg:pypi/python-discovery, pkg:pypi/typing-extensions, pkg:pypi/virtualenv
          comment-summary-in-pr: on-failure
