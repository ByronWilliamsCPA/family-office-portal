# Dependency Review - Analyzes dependency changes in PRs
# Checks for vulnerabilities and license compliance
#
# Features:
#   - Vulnerability detection in dependency changes
#   - License compliance checking
#   - Blocks PRs with high severity vulnerabilities
name: Dependency Review

# #CRITICAL do not add a merge_group: trigger here.
# actions/dependency-review-action reads github.event.pull_request.base
# and .head internally and hard-fails under merge_group ("Both a base
# ref and head ref must be provided...") because that event carries no
# pull_request payload (see actions/dependency-review-action issues
# 456, 841, 843). This job's name, "Dependency & Standards Validation",
# is identical to the gate job in pr-validation.yml; a hard failure
# here under merge_group would create a second, failing check run
# under that same required-context name alongside the passing one
# from pr-validation.yml, jeopardizing rather than fixing the merge
# queue. pr-validation.yml's gate job already emits this same context
# successfully under merge_group (added in this PR), so the required
# status check is satisfied without this workflow running in the
# merge queue at all.
# #VERIFY if this workflow is ever changed to run under merge_group,
# pass explicit base-ref/head-ref inputs first, using the community
# workaround: github.base_ref || github.event.merge_group.base_ref
on:
  pull_request:
    branches: [main, master, develop]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Dependency & Standards Validation
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          # SPDX expressions for permissive open-source licenses we accept.
          # PSF-2.0 (Python Software Foundation) and HPND-Markus-Kuhn are both
          # OSI-approved permissive licenses; included to admit `distlib` and
          # `wcwidth` whose composite licenses are not covered by the base list.
          allow-licenses: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, MPL-2.0, LGPL-2.1, LGPL-3.0, Python-2.0, Unlicense, CC0-1.0, GPL-3.0-or-later, PSF-2.0, HPND-Markus-Kuhn
          # Dev-only dependencies that PyPI metadata reports without an SPDX
          # license expression. Each has a documented permissive license on its
          # repository or PyPI classifier; vetted manually:
          #   - commitizen: MIT
          #   - hypothesis: MPL-2.0
          #   - pydantic-settings: MIT
          #   - python-discovery: MIT
          #   - virtualenv: MIT
          allow-dependencies-licenses: pkg:pypi/commitizen, pkg:pypi/hypothesis, pkg:pypi/pydantic-settings, pkg:pypi/python-discovery, pkg:pypi/virtualenv
          comment-summary-in-pr: on-failure
