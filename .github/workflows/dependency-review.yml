# Dependency Review - Analyzes dependency changes in PRs
# Checks for vulnerabilities and license compliance
#
# Features:
#   - Vulnerability detection in dependency changes
#   - License compliance checking
#   - Blocks PRs with high severity vulnerabilities
name: Dependency Review

# #CRITICAL do not add a merge_group: trigger here.
# actions/dependency-review-action reads github.event.pull_request.base
# and .head and hard-fails under merge_group, which carries no
# pull_request payload. This job shares the required context name
# "Dependency & Standards Validation" with the gate job in
# pr-validation.yml, so a failing run here would put a second, failing
# check under that required context inside the merge queue.
# pr-validation.yml already emits the context under merge_group.
# #VERIFY before enabling merge_group here, pass explicit base-ref and
# head-ref inputs (github.event.merge_group.base_sha / head_sha).
on:
  pull_request:
    branches: [main, master, develop]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: dependency-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency & Standards Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden the runner (Audit outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          # SPDX expressions for permissive open-source licenses we accept.
          # PSF-2.0 (Python Software Foundation) and HPND-Markus-Kuhn are both
          # OSI-approved permissive licenses; included to admit `distlib` and
          # `wcwidth` whose composite licenses are not covered by the base list.
          allow-licenses: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, MPL-2.0, LGPL-2.1, LGPL-3.0, Python-2.0, Unlicense, CC0-1.0, GPL-3.0-or-later, PSF-2.0, HPND-Markus-Kuhn
          # Dev-only dependencies that PyPI metadata reports without an SPDX
          # license expression. Each has a documented permissive license on its
          # repository or PyPI classifier; vetted manually:
          #   - commitizen: MIT
          #   - hypothesis: MPL-2.0
          #   - pydantic-settings: MIT
          #   - python-discovery: MIT
          #   - virtualenv: MIT
          allow-dependencies-licenses: pkg:pypi/commitizen, pkg:pypi/hypothesis, pkg:pypi/pydantic-settings, pkg:pypi/python-discovery, pkg:pypi/virtualenv
          comment-summary-in-pr: on-failure
