# Build, smoke-test, sign, and push the portal image to GHCR.
# Pattern follows cyo-adventure's build-images.yml. homelab-infra's
# services/family-office-portal stack pins VERSION=sha-<short>.
name: Build Image

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.claude/**'
  workflow_dispatch:
    inputs:
      push:
        description: 'Push image to registry (false for a build and smoke test only)'
        required: false
        default: true
        type: boolean

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/byronwilliamscpa/family-office-portal

jobs:
  build:
    name: Build portal image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Harden the runner (Audit outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Compute tags
        id: meta
        env:
          SOURCE_SHA: ${{ github.sha }}
          IS_MAIN: ${{ github.ref == 'refs/heads/main' }}
        run: |
          SHA_TAG="sha-${SOURCE_SHA:0:7}"
          TAGS="${IMAGE}:${SHA_TAG}"
          if [ "${IS_MAIN}" = "true" ]; then
            TAGS="${TAGS},${IMAGE}:latest,${IMAGE}:$(date +%Y%m%d)"
          fi
          {
            echo "tags=${TAGS}"
            echo "sha_tag=${SHA_TAG}"
          } >> "$GITHUB_OUTPUT"

      - name: Build image for smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: family-office-portal-smoke:ci
          cache-from: type=gha,scope=family-office-portal
          cache-to: type=gha,mode=max,scope=family-office-portal

      - name: Smoke test
        run: |  # pragma: allowlist secret
          set -euo pipefail
          cleanup() { docker rm -f portal-smoke >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run -d --name portal-smoke -p 18000:8000 \
            -e BACKEND_LLC_MANAGER_URL=http://llc.invalid \
            -e BACKEND_LLC_MANAGER_API_KEY=smoke \
            -e BACKEND_PP_SECURITY_URL=http://pp.invalid \
            -e BACKEND_PP_SECURITY_API_KEY=smoke \
            -e BACKEND_XERO_CRYPTO_URL=http://xero.invalid \
            -e BACKEND_XERO_CRYPTO_API_KEY=smoke \
            -e AUTHENTIK_JWKS_URL=https://auth.invalid/jwks/ \
            -e AUTHENTIK_ISSUER=https://auth.invalid/ \
            -e AUTHENTIK_AUDIENCE=smoke \
            -e SQLITE_PATH=/tmp/portal.db \
            -e SCHEDULER_ENABLED=false \
            family-office-portal-smoke:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:18000/health >/dev/null 2>&1; then
              ok=1; break
            fi
            sleep 2
          done
          if [ -z "${ok:-}" ]; then
            docker logs portal-smoke || true
            exit 1
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:18000/)
          if [ "${code}" != "403" ]; then
            echo "expected 403 without identity, got ${code}"
            exit 1
          fi
          curl -fsS http://localhost:18000/static/css/output.css >/dev/null

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'workflow_dispatch' || inputs.push == true }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=family-office-portal
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Sign image
        if: >-
          github.ref == 'refs/heads/main' &&
          steps.build.outputs.digest != '' &&
          (github.event_name != 'workflow_dispatch' || inputs.push == true)
        env:
          IMAGE_DIGEST_REF: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE_DIGEST_REF}"

      - name: Summary
        env:
          SHA_TAG: ${{ steps.meta.outputs.sha_tag }}
        run: |
          {
            echo "### Portal image"
            echo "Pin in homelab-infra stack: \`VERSION=${SHA_TAG}\`"
          } >> "$GITHUB_STEP_SUMMARY"
